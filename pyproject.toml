[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appletart"
version = "0.2.0"
description = "Browser wizard and lifecycle management for Linux and macOS VMs on Apple Silicon with Tart"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
appletart = "appletart.cli:main"

[tool.setuptools.packages.find]
include = ["appletart*"]

[tool.setuptools.package-data]
appletart = ["data/*.json", "native/*.js", "static/*.html", "static/*.css", "static/*.js", "static/*.yaml", "static/icons/*.svg", "static/icons/*.md"]
