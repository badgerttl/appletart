version = 1

[[vms]]
name = "kali-lab"
os = "kali"
# A previously installed, shut-down ARM64 Kali Tart VM.
image = "kali-template"
cpu = 2
memory_mb = 4096
ssh_user = "kali" # Change to the existing login in your template.
ssh_public_keys = ["~/.ssh/id_ed25519.pub"]
# Omit disk_gb to preserve the template size; Tart cannot shrink disks.
